name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --check
        if: matrix.os == 'ubuntu-latest'

      - run: cargo clippy --workspace -- -D warnings
        if: matrix.os == 'ubuntu-latest'

      - run: cargo test --workspace

  cli-smoke:
    name: CLI smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cargo build -p agentdir-cli

      - name: Run CLI smoke
        shell: bash
        run: |
          AGENTDIR_BIN="target/debug/agentdir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            AGENTDIR_BIN="target/debug/agentdir.exe"
          fi
          python scripts/ci/cli_smoke.py --agentdir "$AGENTDIR_BIN"

  strategy-smoke:
    name: Strategy smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: rust
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: cargo build -p agentdir-cli

      - name: Run strategy smoke
        shell: bash
        run: |
          AGENTDIR_BIN="target/debug/agentdir"
          if [ "$RUNNER_OS" = "Windows" ]; then
            AGENTDIR_BIN="target/debug/agentdir.exe"
          fi
          python scripts/ci/strategy_smoke.py --agentdir "$AGENTDIR_BIN"

  release-qa:
    name: Release QA artifact checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python3 crates/agentdir/tests/issue_18_release_qa.py

  python:
    name: Python (ruff, deptry, pytest)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: bindings/python
        run: uv sync

      - name: Build native extension
        working-directory: bindings/python
        run: uv run maturin develop

      - name: Lint (ruff check)
        working-directory: bindings/python
        run: uv run ruff check .

      - name: Format (ruff format)
        working-directory: bindings/python
        run: uv run ruff format --check .

      - name: Dependency check (deptry)
        working-directory: bindings/python
        run: uv run deptry .

      - name: Test (pytest)
        working-directory: bindings/python
        run: uv run pytest -v

  node:
    name: Node (oxlint, ava)
    runs-on: ubuntu-latest
    needs: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        working-directory: bindings/node
        run: npm install

      - name: Build native extension
        working-directory: bindings/node
        run: npm run build:debug

      - name: Lint (oxlint)
        working-directory: bindings/node
        run: npm run lint

      - name: Test (ava)
        working-directory: bindings/node
        run: |
          set +e
          npm test > test-output.txt 2>&1
          EXIT=$?
          cat test-output.txt
          if grep -q "tests passed" test-output.txt && ! grep -q "tests failed" test-output.txt; then
            echo "All tests passed (exit code $EXIT may be from NAPI cleanup signal)"
            exit 0
          fi
          exit $EXIT
